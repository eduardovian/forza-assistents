[pytest]
# O repositório contém cópias de outros projetos de pesquisa.  A suíte deste
# aplicativo é somente ``tests``; CLRerNet não faz parte da integração ativa.
testpaths = tests
addopts = --ignore=tests/test_yolop.py

# tests/test_yolop.py valida o antigo runtime ONNX e seu peso .onnx.  O
# runtime oficial agora é o TorchScript YOLOPv2 em vision/yolop_detector.py.
